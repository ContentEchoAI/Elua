name: Hummingbird Ops Bot

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Run Hummingbird checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run Lead Finder
        run: npm run lead:finder

      - name: Upload Lead Finder report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lead-finder-report
          path: lead-finder/reports/

      - name: Write approval summary
        if: always()
        run: |
          {
            echo "## Hummingbird Ops Bot"
            echo ""
            echo "### Approval rule"
            echo ""
            echo "Bots may run checks and prepare reports, but Brandon approval is required before:"
            echo ""
            echo "- merging to main"
            echo "- deploying production"
            echo "- publishing to Facebook/Instagram"
            echo "- sending outreach, replies, comments, or emails"
            echo "- changing Stripe, Clerk, Supabase, auth, API keys, or pricing"
            echo ""
            echo "### Review needed"
            echo ""
            echo "Check the workflow result, build/lint status, and uploaded Lead Finder report before approving the next action."
          } >> "$GITHUB_STEP_SUMMARY"
